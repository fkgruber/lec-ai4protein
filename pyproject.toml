[project]
name = "ai4protein"
version = "0.1.0"
description = "Lecture materials for AI for Protein course (KAIST Spring 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Prof. Ahn", email = "ahn@kaist.ac.kr" }
]

dependencies = [
    # Core scientific computing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",

    # Deep learning
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",

    # Protein tools
    "biopython>=1.81",
    "biotite>=0.38.0",
    "fair-esm>=2.0.0",

    # Transformers and fine-tuning
    "transformers>=4.30.0",
    "peft>=0.5.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "py3Dmol>=2.0.0",

    # Utilities
    "einops>=0.6.0",
    "tqdm>=4.65.0",
    "ipywidgets>=8.0.0",

    # Jupyter
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.0.270",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai4protein"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
